<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniGestão</title>
<link rel="icon" href="/marca/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/core.css">
<style>
  .topo {
    background: var(--accent); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    /* No celular a barra nao cabe em uma linha. Sem isto ela nao estoura a
       pagina — os itens espremem —, mas cada um quebra sozinho no meio:
       "Rodrigo / Moraes", "Admin / Geral". Deixando a barra quebrar, o nome e
       os links descem juntos para uma segunda linha e continuam legiveis. */
    flex-wrap: wrap;
  }
  .topo h1 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
  .topo h1 img { width: 30px; height: 30px; }
  .topo h1 span { color: var(--laranja); }
  /* O simbolo e o nome levam para a tela inicial. Sublinhado nao entra: uma
     marca sublinhada parece texto quebrado, e o cursor de mao ja avisa que
     e clicavel. */
  /* Sem `gap` aqui: ele separaria tambem "Uni" de "Gestão", que sao dois
     itens do flex (o texto solto e o <span> laranja), e a marca saía escrita
     "Uni Gestão". O espaco que se quer e so depois do simbolo — por isso ele
     e margem da imagem, e nao gap do conjunto. */
  .topo h1 a { color: inherit; text-decoration: none; display: flex;
               align-items: center; }
  .topo h1 a img { margin-right: 10px; }
  .topo h1 a:hover { opacity: .85; }

  .topo .quem { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .topo a, .topo button {
    color: #fff; background: none; border: 0; font: inherit; font-size: 14px;
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  /* Marca d'agua.
     Fixa, nao rolando junto: ancorada no canto inferior direito, ela e pano de
     fundo e nao um elemento que persegue a pagina. Sangra para fora da tela de
     proposito — marca d'agua inteirinha e centralizada vira selo de documento.
     pointer-events:none para nao roubar clique de nada que passe por cima. */
  body::before {
    content: "";
    position: fixed;
    right: -70px;
    bottom: -80px;
    width: 460px;
    height: 460px;
    background: url("/marca/simbolo.svg") no-repeat center / contain;
    opacity: .07;
    pointer-events: none;
    z-index: 0;
  }
  /* No celular a mesma medida cobriria metade da tela e viraria ruido atras
     dos cartoes, que ali ocupam a largura toda. */
  @media (max-width: 640px) {
    body::before { width: 260px; height: 260px; right: -50px; bottom: -50px; opacity: .05; }
    .topo { padding: 12px 16px; }
    main { padding: 24px 16px 48px; }
  }
  /* O conteudo precisa declarar posicao para ficar acima do pseudo-elemento;
     sem isto o cartao branco continua opaco, mas a barra navy some atras. */
  .topo, main { position: relative; z-index: 1; }

  main { max-width: 1180px; margin: 0 auto; padding: 34px 24px 60px; }

  /* Duas colunas: modulos a esquerda, mural a direita.
     O mural desce para baixo dos modulos quando a tela encolhe — numa tela
     estreita ele empurraria os cartoes para uma faixa espremida, e os modulos
     sao o motivo pelo qual a pessoa entrou. */
  .colunas { display: grid; gap: 26px; grid-template-columns: 1fr 320px; align-items: start; }
  @media (max-width: 900px) { .colunas { grid-template-columns: 1fr; } }

  /* Reservas de sala: mesma coluna do mural, acima dele. Fica em cima porque e
     informacao com hora marcada — perder de vista custa uma reuniao; o mural
     espera. */
  .salas { margin-bottom: 26px; }
  .salas h3 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .salas .reserva { padding: 11px 14px; margin-bottom: 8px; display: flex; gap: 12px;
                    align-items: baseline; }
  .salas .quando { flex: 0 0 auto; text-align: center; min-width: 46px; }
  .salas .dia { display: block; font-size: 12px; font-weight: 700; color: var(--laranja);
                text-transform: uppercase; letter-spacing: .03em; }
  .salas .hora { display: block; font-size: 13px; font-weight: 700; color: var(--accent);
                 white-space: nowrap; }
  .salas .oque { flex: 1; min-width: 0; }
  /* display:block nos dois: sao <span>, e sem isto o titulo e a sala saem na
     mesma linha, grudados. */
  .salas .titulo-reserva { display: block; font-size: 13.5px; color: var(--texto);
                           line-height: 1.35; overflow: hidden; text-overflow: ellipsis;
                           white-space: nowrap; }
  .salas .sala { display: block; font-size: 12px; color: var(--texto-fraco); margin-top: 2px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Reserva de hoje ganha um traco: e a que muda o que a pessoa faz agora. */
  .salas .reserva.hoje { border-left: 3px solid var(--laranja); }
  .salas .nenhuma { padding: 13px 14px; font-size: 13px; color: var(--texto-fraco);
                    line-height: 1.5; }
  .salas .todos { display: block; text-align: center; font-size: 13px; padding: 8px;
                  color: var(--accent); text-decoration: none; }
  .salas .todos:hover { text-decoration: underline; }

  .mural h3 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .mural .conta {
    background: var(--laranja); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; padding: 1px 7px;
  }
  .aviso-cartao { padding: 15px 16px; margin-bottom: 10px; position: relative; }
  .aviso-cartao.destaque { border-left: 3px solid var(--laranja); }
  .aviso-cartao h4 { font-size: 14px; margin: 0 0 4px; color: var(--accent); line-height: 1.35; }
  .aviso-cartao p { margin: 0; font-size: 13px; color: var(--texto-fraco); line-height: 1.55;
                    white-space: pre-wrap; }
  .aviso-topo { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .aviso-tipo {
    font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; padding: 2px 7px; border-radius: 4px;
  }
  .aviso-tipo.aviso   { background: var(--accent-soft); color: var(--accent); }
  .aviso-tipo.mudanca { background: #FDF0E0; color: #9a4d05; }
  .aviso-tipo.evento  { background: #E7F4EC; color: #06603c; }
  .aviso-pino { font-size: 11px; color: var(--texto-fraco); }
  .aviso-rodape { margin-top: 8px; font-size: 11.5px; color: var(--texto-fraco); }
  .mural .todos { display: block; text-align: center; font-size: 13px; padding: 8px;
                  color: var(--accent); text-decoration: none; }
  .mural .todos:hover { text-decoration: underline; }

  /* Pop-up: interrompe a pessoa antes de ela fazer o que veio fazer, entao so
     aparece uma vez por publicacao e some para sempre depois de fechada. */
  .cortina {
    position: fixed; inset: 0; background: rgba(20,28,44,.55); z-index: 100;
    display: grid; place-items: center; padding: 20px;
  }
  /* O cartao NUNCA passa da altura da tela.
     Ele e uma coluna: cabecalho em cima, botoes embaixo, e so o meio rola.
     Sem isto, comunicado com imagem alta empurrava o botao "Entendi" para fora
     da tela — e como a cortina nao rola, a pessoa ficava presa na tela inicial
     sem nenhum jeito de fechar. Aconteceu com o comunicado do chat (08/09). */
  .popup {
    width: 100%; max-width: 480px; padding: 0; overflow: hidden;
    max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  }
  .popup .cab {
    background: var(--accent); color: #fff; padding: 14px 20px; font-size: 14px;
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
  }
  /* Segunda saida, sempre visivel no alto. Uma so porta de saida, la embaixo,
     e o que criou o problema. */
  .popup .cab .x {
    margin-left: auto; background: none; border: 0; color: #fff; cursor: pointer;
    font-size: 20px; line-height: 1; padding: 0 4px; border-radius: 4px; opacity: .85;
  }
  .popup .cab .x:hover { opacity: 1; background: rgba(255,255,255,.15); }
  .popup .rolagem { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .popup .miolo { padding: 22px; }
  .popup h3 { font-size: 18px; margin: 0 0 8px; color: var(--accent); }
  .popup p { margin: 0; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; }
  .popup img { width: 100%; display: block; }
  .popup .pe {
    padding: 14px 22px; display: flex; gap: 10px; justify-content: flex-end;
    flex: 0 0 auto; border-top: 1px solid var(--borda); background: var(--surface);
  }
  .titulo { margin-bottom: 6px; font-size: 22px; }
  .sub { color: var(--texto-fraco); margin: 0 0 28px; }
  /* Cartao mais largo que antes porque o icone ocupa uma faixa a esquerda:
     com o minimo antigo (270px) o titulo de "Movimentação Operacional"
     quebrava em duas linhas ao lado do icone. */
  /* min(330px, 100%) e o que impede o cartao de estourar a tela do celular:
     num aparelho de 360px sobram ~328px, e um minimo fixo de 330px passaria
     do que cabe. Com o min(), a coluna encolhe junto com a tela. */
  .grade { display: grid; gap: 16px;
           grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
  .modulo {
    display: flex; gap: 15px; align-items: flex-start;
    padding: 18px 20px; text-decoration: none; color: inherit;
    transition: transform .12s, box-shadow .12s;
  }
  .modulo:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(16,24,40,.1); }
  /* O icone entra num quadrado de fundo quente para o cartao ter um ponto de
     entrada para o olho. O traco e o LARANJA, nao o amarelo da marca: amarelo
     sobre branco quase nao se le. */
  .modulo .ic {
    width: 44px; height: 44px; border-radius: 11px; flex: none;
    background: #FDF0E0; display: grid; place-items: center;
  }
  .modulo .ic svg {
    width: 24px; height: 24px; stroke: var(--laranja); fill: none;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  /* min-width:0 para o texto poder encolher dentro do flex; sem isso um nome
     comprido empurra o cartao para fora da coluna em vez de quebrar. */
  .modulo .txt { min-width: 0; }
  .modulo h3 { font-size: 16px; margin-bottom: 3px; color: var(--accent); }
  .modulo p { margin: 0 0 10px; font-size: 13.5px; color: var(--texto-fraco); }
  /* Mural e Agenda sao do proprio portal, nao sistemas com banco proprio. O
     contorno tracejado marca essa diferenca sem precisar de rotulo extra —
     e o mesmo recurso usado na arte de apresentacao do portal. */
  .modulo.doPortal { border-style: dashed; border-color: #F0C98A; background: #FFFDF9; }
  .modulo.doPortal .ic { background: #FBE7CB; }
  /* Sistema de terceiro: o icone fica cinza, nao laranja. A cor da marca e para
     o que e nosso — e a seta ↗ avisa que o clique sai do portal. */
  .modulo .fora { color: var(--texto-fraco); font-size: 13px; font-weight: 400; }
  .modulo.foraDoPortal .ic { background: #EFEEEA; }
  .modulo.foraDoPortal .ic svg { stroke: var(--texto-fraco); }
  /* Arrastar para reordenar.
     touch-action:none nos cartoes e o que permite arrastar com o dedo: sem
     isso o navegador entende o movimento como rolagem da pagina e o arrasto
     nunca comeca. */
  .grade .modulo { touch-action: none; }
  .modulo.arrastando {
    opacity: .9; box-shadow: 0 10px 26px rgba(16,24,40,.18);
    transform: scale(1.02); z-index: 5; position: relative; pointer-events: none;
  }
  .modulo.alvo { outline: 2px dashed var(--laranja); outline-offset: 2px; }
  /* Some no celular: la o toque longo ja abre o arrasto, e o icone roubaria
     espaco de um cartao que ja e estreito. */
  .modulo .pegar {
    position: absolute; top: 8px; right: 10px; color: var(--borda);
    font-size: 15px; line-height: 1; letter-spacing: -2px; user-select: none;
  }
  .modulo { position: relative; }
  .modulo:hover .pegar { color: var(--texto-fraco); }
  @media (max-width: 640px) { .modulo .pegar { display: none; } }

  .dicaOrdem { font-size: 12.5px; color: var(--texto-fraco); margin: -18px 0 16px; }
  .dicaOrdem b { color: var(--ok); font-weight: 600; }

  .vazio { padding: 34px; text-align: center; color: var(--texto-fraco); }
  .trocaSenha { max-width: 420px; padding: 28px; }
  .trocaSenha h3 { font-size: 18px; margin-bottom: 6px; }
  .trocaSenha .dica { color: var(--texto-fraco); font-size: 14px; margin: 0 0 20px; }
  .trocaSenha .btn { width: 100%; }
</style>
</head>
<body>

<header class="topo">
  <h1><a href="/" title="Ir para a tela inicial"><img src="/marca/simbolo-claro.svg" alt="" width="30" height="30">Uni<span>Gestão</span></a></h1>
  <div class="quem">
    <span id="nome"></span>
    <a href="/mural">Mural</a>
    <a href="/agenda">Contatos</a>
    <a href="/perfil">Meu perfil</a>
    <a href="/admin" id="linkAdmin" style="display:none">Admin Geral</a>
    <button onclick="sair()">Sair</button>
  </div>
</header>

<main>
  <div class="colunas">
    <div>
      <h2 class="titulo">Seus módulos</h2>
      <p class="sub" id="sub">Carregando…</p>
      <p class="dicaOrdem" id="dicaOrdem" style="display:none">
        Arraste os cartões para deixar na frente o que você mais usa.
        <span id="ordemSalva"></span>
      </p>
      <div class="grade" id="grade"></div>
    </div>
    <div>
    <!-- Reservas de sala da propria pessoa, acima do mural. So aparece para quem
         tem o modulo Tarefas — e de la que os dados vem. -->
    <aside class="salas" id="salas" style="display:none">
      <h3><a href="/tarefas/?ir=agenda-salas" style="color:inherit;text-decoration:none">Suas reservas de sala</a></h3>
      <div id="salasLista"></div>
    </aside>

    <!-- O mural so aparece quando ha o que mostrar: painel vazio na tela toda
         vez ensina a pessoa a ignorar aquele canto. -->
    <aside class="mural" id="mural" style="display:none">
      <h3><a href="/mural" style="color:inherit;text-decoration:none">Mural</a> <span class="conta" id="muralConta" style="display:none"></span></h3>
      <div id="muralLista"></div>
    </aside>
    </div>
  </div>
</main>

<script>
async function carregar() {
  var r = await fetch('/api/eu');
  if (!r.ok) { location.href = '/'; return; }
  var d = await r.json();

  document.getElementById('nome').textContent = d.usuario.nome;
  if (d.usuario.superAdmin) document.getElementById('linkAdmin').style.display = '';

  var grade = document.getElementById('grade');
  var sub = document.getElementById('sub');

  // Quem entrou com senha provisoria nao passa daqui: os modulos so aparecem
  // depois que a pessoa define uma senha propria. O Core tambem barra do lado
  // do servidor, entao pular esta tela pela URL nao adianta.
  if (d.usuario.senhaTemp) return exigirNovaSenha();

  // Cadastro incompleto, com a exigencia ligada: vai completar antes de seguir.
  // A ordem importa — senha primeiro, cadastro depois: nao adianta pedir dados
  // a quem ainda esta com a senha provisoria na mao.
  if (d.usuario.exigirPerfil) { location.href = "/perfil"; return; }

  if (!d.modulos.length) {
    sub.textContent = '';
    // Sem modulo liberado a pessoa ainda tem a agenda: ela e do portal, nao de
    // um sistema, e servir para achar quem liberar o acesso e justamente o que
    // ela precisa neste momento.
    grade.innerHTML = '<div class="card vazio">Você ainda não tem nenhum módulo liberado.<br>' +
                      'Fale com o administrador do sistema.</div>' + cartaoMural() + cartaoAgenda();
    return;
  }

  sub.textContent = d.modulos.length === 1
    ? 'Você tem acesso a 1 módulo.'
    : 'Você tem acesso a ' + d.modulos.length + ' módulos.';

  // Ordena pelo arranjo que a pessoa salvou. Quem nao esta na lista vai para o
  // fim, e nao some: a ordem e preferencia, nunca filtro. Modulo concedido
  // depois tem que aparecer, mesmo sem nunca ter sido arrastado.
  var cartoes = d.modulos.map(function (m) {
    return { chave: m.id, html: cartaoModulo(m) };
  }).concat([
    { chave: 'portal:mural', html: cartaoMural() },
    { chave: 'portal:agenda', html: cartaoAgenda() },
  ]);
  if (d.usuario.podeVerChecklists) {
    cartoes.push({ chave: 'portal:checklists', html: cartaoChecklists() });
  }
  // O atalho da agenda de salas so existe para quem alcanca as Tarefas.
  var temTarefas = d.modulos.some(function (m) { return m.id === 'tarefas'; });
  if (temTarefas) {
    cartoes.push({ chave: 'tarefas:salas', html: cartaoSalas() });
  }

  var ordem = d.usuario.ordemModulos || [];
  var posicao = {};
  ordem.forEach(function (c, i) { posicao[c] = i; });
  cartoes.sort(function (a, b) {
    var pa = posicao[a.chave], pb = posicao[b.chave];
    if (pa === undefined && pb === undefined) return 0;   // mantém a ordem natural
    if (pa === undefined) return 1;                        // novidade vai para o fim
    if (pb === undefined) return -1;
    return pa - pb;
  });

  grade.innerHTML = cartoes.map(function (c) {
    return c.html.replace('<a class="card modulo',
      '<a data-chave="' + esc(c.chave) + '" class="card modulo');
  }).join('');
  grade.querySelectorAll('.modulo').forEach(function (el) {
    el.insertAdjacentHTML('afterbegin', '<span class="pegar" title="Arraste para mover">⠿</span>');
  });
  if (cartoes.length > 1) document.getElementById('dicaOrdem').style.display = '';
  ligarArrasto();

  if (temTarefas) reservasPendentes = carregarReservas();

  carregarMural();
}

// ---------------------------------------------------------------------------
// Mural na tela inicial — os 5 mais recentes
// ---------------------------------------------------------------------------
// So um resumo: o mural inteiro, com curtida, comentario e historico, mora em
// /mural. Aqui a pessoa ve o que mudou desde a ultima vez e clica se quiser.
var TIPO_ROTULO = { aviso: 'Aviso', mudanca: 'Mudança', evento: 'Evento' };

async function carregarMural() {
  var r = await fetch('/api/mural?limite=5');
  if (!r.ok) return;
  var pubs = (await r.json()).publicacoes || [];
  if (!pubs.length) return;   // sem publicacao, o painel nem aparece

  var naoLidos = pubs.filter(function (p) { return !p.li; }).length;
  document.getElementById('mural').style.display = '';
  if (naoLidos) {
    var c = document.getElementById('muralConta');
    c.textContent = naoLidos + ' nov' + (naoLidos > 1 ? 'os' : 'o');
    c.style.display = '';
  }

  document.getElementById('muralLista').innerHTML = pubs.map(function (p) {
    var tipo = TIPO_ROTULO[p.tipo] || 'Aviso';
    return '<a class="card aviso-cartao' + (p.li ? '' : ' destaque') + '" href="/mural" ' +
             'style="display:block;text-decoration:none;color:inherit">' +
      '<div class="aviso-topo">' +
        '<span class="aviso-tipo ' + esc(p.tipo) + '">' + esc(tipo) + '</span>' +
        (p.fixado ? '<span class="aviso-pino">fixado</span>' : '') +
      '</div>' +
      '<h4>' + esc(p.titulo) + '</h4>' +
      (p.texto ? '<p>' + esc(p.texto.slice(0, 130)) + (p.texto.length > 130 ? '…' : '') + '</p>' : '') +
      '<div class="aviso-rodape">' + esc(quando(p.criado_em)) +
        (p.autor ? ' · ' + esc(p.autor) : '') +
        (p.curtidas ? ' · ' + p.curtidas + ' ★' : '') +
        (p.comentarios ? ' · ' + p.comentarios + ' 💬' : '') +
      '</div>' +
    '</a>';
  }).join('') + '<a class="todos" href="/mural">Ver tudo no mural →</a>';

  mostrarPopup();
}

// "hoje", "ontem", "há 3 dias" — data cheia so quando ja e coisa antiga.
function quando(iso) {
  var dias = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (dias <= 0) return 'hoje';
  if (dias === 1) return 'ontem';
  if (dias < 7) return 'há ' + dias + ' dias';
  return new Date(iso).toLocaleDateString('pt-BR');
}

// ---------------------------------------------------------------------------
// Pop-up
// ---------------------------------------------------------------------------
// Um por vez, e so enquanto o prazo do comunicado durar. Dois pop-ups seguidos
// viram uma fila de janelas para fechar, e a pessoa fecha as duas sem ler.
async function mostrarPopup() {
  var r = await fetch('/api/mural/popup');
  if (!r.ok) return;
  var p = (await r.json()).publicacao;
  if (!p) return;

  var cortina = document.createElement('div');
  cortina.className = 'cortina';
  cortina.innerHTML =
    '<div class="card popup">' +
      '<div class="cab">Comunicado — ' + esc(TIPO_ROTULO[p.tipo] || 'Aviso') +
        '<button class="x" id="fecharPopupX" title="Fechar">&#215;</button>' +
      '</div>' +
      '<div class="rolagem">' +
        (p.tem_imagem ? '<img src="/api/mural/' + p.id + '/imagem" alt="">' : '') +
        '<div class="miolo">' +
          '<h3>' + esc(p.titulo) + '</h3>' +
          (p.texto ? '<p>' + esc(p.texto) + '</p>' : '') +
        '</div>' +
      '</div>' +
      '<div class="pe">' +
        '<a class="btn btn-sec" href="/mural">Abrir no mural</a>' +
        '<button class="btn" id="fecharPopup">Entendi</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(cortina);

  // Clicar FORA continua nao fechando: o pop-up nao volta, e a pessoa perderia
  // o comunicado por um clique distraido. Mas agora ha duas portas de saida —
  // o "Entendi" embaixo e o "x" no alto, que fica visivel por mais alta que
  // seja a imagem. Uma porta so, no fim de um cartao comprido, foi o que
  // prendeu todo mundo na tela inicial.
  async function fechar() {
    await fetch('/api/mural/' + p.id + '/lido', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ popup: true }),
    }).catch(function () { /* fechar nao pode depender da rede */ });
    cortina.remove();
  }

  document.getElementById('fecharPopup').addEventListener('click', fechar);
  document.getElementById('fecharPopupX').addEventListener('click', fechar);

  // Esc tambem fecha — e o reflexo de quem se sente preso numa tela.
  document.addEventListener('keydown', function aoTeclar(ev) {
    if (ev.key !== 'Escape') return;
    document.removeEventListener('keydown', aoTeclar);
    fechar();
  });
}

// Mural e Agenda aparecem como cartoes junto dos modulos, porque e ali que as
// pessoas procuram o que o sistema oferece. Mas NAO entram no registro de
// modulos: aquele registro guarda sistemas independentes, cada um com o
// proprio banco, alcancados pela Fachada. Os dois sao parte do proprio portal
// — registra-los faria a Fachada tentar encaminhar para um servico que nao
// existe.
//
// O selo diz "Todo o grupo" em vez de um papel: nao ha papel, todo mundo que
// entra no portal enxerga os dois.
// Um cartao de modulo. Sistema de terceiro (com `externo`) abre no endereco do
// fornecedor, em outra aba: la nao existe a barra do portal, e sem aba nova a
// pessoa perderia o portal de vista. A seta ↗ avisa disso antes do clique.
function cartaoModulo(m) {
  var fora = Boolean(m.externo);
  return '<a class="card modulo' + (fora ? ' foraDoPortal' : '') + '" href="' +
           esc(fora ? m.externo : m.base + '/') + '"' +
           (fora ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
           icone(m.icone) +
           '<div class="txt">' +
             '<h3>' + esc(m.nome) + (fora ? ' <span class="fora">↗</span>' : '') + '</h3>' +
             '<p>' + esc(m.descricao || '') + '</p>' +
             '<span class="selo selo-off">' + esc(m.papelRotulo || m.papel) + '</span>' +
           '</div>' +
         '</a>';
}

// So aparece para quem foi marcado no Admin Geral (e para o administrador
// geral). Cartao de tela que a pessoa nao pode abrir e so frustracao.
function cartaoChecklists() {

           '<div class="txt">' +

}

function cartaoMural() {

             '<h3>Mural</h3>' +

// "de Contatos" no nome porque existem DUAS agendas no portal, e as duas
// apareciam como "Agenda": esta, que e a lista de gente do grupo, e a de salas,
// que e reserva de sala de reuniao e mora dentro das Tarefas.

           '<div class="txt">' +

}

// Atalho para uma tela DENTRO das Tarefas — a reserva de sala de reuniao. Vale
// um cartao proprio porque muita gente entra no portal so para isso e nao tem
// por que passar pelo Dashboard de tarefas no caminho.
//
// So aparece para quem tem o modulo Tarefas: cartao que leva a um 403 e pior do
// que cartao nenhum. O `?ir=agenda-salas` e lido la dentro (ver
// abrirDestinoDoLink no index.html das Tarefas).
function cartaoSalas() {
  // Icone de calendario, e nao o de agenda: a "Agenda de Contatos" logo acima ja
  // usa aquele, e duas agendas com o mesmo desenho e exatamente a confusao que
  // este cartao veio desfazer.

           '<div class="txt">' +
             '<h3>Agenda de Salas</h3>' +

}

// ---------------------------------------------------------------------------
// Icones dos cartoes
// ---------------------------------------------------------------------------
// O nome vem do proprio registro de modulos (core/modulos.js, campo `icone`),
// que ja existia e nunca tinha sido usado na tela. Sao desenhos de traco, sem
// preenchimento, para o cartao nao competir com o conteudo.
//
// Modulo com um `icone` que nao esteja aqui cai no quadrado generico em vez de
// abrir um buraco no cartao — plugar um sistema novo nunca deve quebrar a tela
// inicial por causa de um icone que faltou.
var ICONES = {
  truck:     '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',
  folder:    '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  calendar:  '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  check:     '<path d="M4 12.5 9 17.5 20 6.5"/>',
  briefcase: '<rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M2.5 12h19"/>',
  calculator:'<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 7h7M8.5 11.5h2M13.5 11.5h2M8.5 16h2M13.5 16h2"/>',
  checklist: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3h6v3H9zM8 12l2.5 2.5L16 9"/>',
  megafone:  '<path d="M4 9v6h3l9 5V4L7 9zM19 9.5a4 4 0 0 1 0 5"/>',
  agenda:    '<rect x="5" y="3" width="15" height="18" rx="2"/><path d="M5 8H3M5 12H3M5 16H3"/><circle cx="12.5" cy="10" r="2.3"/><path d="M9 17a3.5 3.5 0 0 1 7 0"/>',
  send:      '<path d="M21 3 10.5 13.5M21 3l-6.5 18-4-8.5L2 8.5z"/>',
  padrao:    '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/>',
};

function icone(nome) {
  return '<div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' +
         (ICONES[nome] || ICONES.padrao) + '</svg></div>';
}

// ---------------------------------------------------------------------------
// ARRASTAR PARA REORDENAR
// ---------------------------------------------------------------------------
// Feito com eventos de ponteiro, e nao com o drag-and-drop nativo do HTML: o
// nativo simplesmente nao existe no celular, e a tela inicial e usada muito no
// telefone.
//
// Dois cuidados que fazem a diferenca entre util e irritante:
//
//   1. Os cartoes sao LINKS. Sem um limiar de movimento, todo arrasto acabaria
//      abrindo o modulo. So vira arrasto depois de andar alguns pixels — e o
//      clique seguinte e cancelado se houve arrasto.
//
//   2. `touch-action: none` no CSS. Sem isso o navegador trata o movimento do
//      dedo como rolagem e o arrasto nunca acontece no celular.
var LIMIAR_PX = 6;
var arrasto = null;

function ligarArrasto() {
  document.getElementById('grade').querySelectorAll('.modulo').forEach(function (el) {
    el.addEventListener('pointerdown', comecar);
    // Se houve arrasto, o clique que vem depois nao pode abrir o modulo.
    el.addEventListener('click', function (ev) {
      if (el.dataset.arrastou === '1') { ev.preventDefault(); el.dataset.arrastou = ''; }
    });
  });
}

function comecar(ev) {
  if (ev.button !== undefined && ev.button !== 0) return;   // so botao principal
  var el = ev.currentTarget;
  arrasto = { el: el, x0: ev.clientX, y0: ev.clientY, ativo: false };
  el.setPointerCapture && el.setPointerCapture(ev.pointerId);
  el.addEventListener('pointermove', mover);
  el.addEventListener('pointerup', soltar);
  el.addEventListener('pointercancel', soltar);
}

function mover(ev) {
  if (!arrasto) return;
  var dx = ev.clientX - arrasto.x0, dy = ev.clientY - arrasto.y0;
  if (!arrasto.ativo) {
    if (Math.abs(dx) + Math.abs(dy) < LIMIAR_PX) return;    // ainda pode ser clique
    arrasto.ativo = true;
    arrasto.el.classList.add('arrastando');
    arrasto.el.dataset.arrastou = '1';
  }
  arrasto.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.02)';

  // Onde ele cairia: o cartao cujo centro esta mais perto do ponteiro.
  var alvo = cartaoSob(ev.clientX, ev.clientY);
  document.querySelectorAll('.modulo.alvo').forEach(function (x) { x.classList.remove('alvo'); });
  if (alvo && alvo !== arrasto.el) alvo.classList.add('alvo');
}

function cartaoSob(x, y) {
  var perto = null, menor = Infinity;
  document.getElementById('grade').querySelectorAll('.modulo').forEach(function (el) {
    if (el === arrasto.el) return;
    var r = el.getBoundingClientRect();
    var d = Math.abs(x - (r.left + r.width / 2)) + Math.abs(y - (r.top + r.height / 2));
    if (d < menor) { menor = d; perto = el; }
  });
  // Longe de qualquer cartao, nao ha alvo: soltar no vazio nao deve mover nada.
  return menor < 400 ? perto : null;
}

function soltar(ev) {
  if (!arrasto) return;
  var el = arrasto.el;
  el.removeEventListener('pointermove', mover);
  el.removeEventListener('pointerup', soltar);
  el.removeEventListener('pointercancel', soltar);
  el.style.transform = '';
  el.classList.remove('arrastando');

  var alvo = arrasto.ativo ? cartaoSob(ev.clientX, ev.clientY) : null;
  document.querySelectorAll('.modulo.alvo').forEach(function (x) { x.classList.remove('alvo'); });
  arrasto = null;

  if (!alvo || alvo === el) return;
  var grade = document.getElementById('grade');
  var todos = [].slice.call(grade.querySelectorAll('.modulo'));
  // Antes ou depois do alvo, conforme a direcao do movimento.
  if (todos.indexOf(el) < todos.indexOf(alvo)) alvo.after(el);
  else alvo.before(el);
  salvarOrdem();
}

async function salvarOrdem() {
  var chaves = [].slice.call(document.getElementById('grade').querySelectorAll('.modulo'))
    .map(function (el) { return el.getAttribute('data-chave'); })
    .filter(Boolean);
  var aviso = document.getElementById('ordemSalva');
  try {
    var r = await fetch('/api/eu/ordem-modulos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ordem: chaves }),
    });
    if (!r.ok) throw new Error();
    // O aviso e curto de proposito: confirma e some, sem virar ruido.
    aviso.innerHTML = '<b>Ordem salva.</b>';
    setTimeout(function () { aviso.innerHTML = ''; }, 2500);
  } catch (e) {
    // Falhou: a tela mostra a ordem nova, mas o servidor tem a antiga. Dizer
    // isso e melhor do que deixar a pessoa achar que salvou.
    aviso.textContent = 'Não consegui salvar a ordem — ela volta ao recarregar.';
  }
}

// ---------------------------------------------------------------------------
// RESERVAS DE SALA DA PROPRIA PESSOA
// ---------------------------------------------------------------------------
// Os dados moram nas Tarefas, e sao buscados PELO NAVEGADOR atraves da Fachada
// (/tarefas/api/...). A Fachada ja confere a sessao e anexa a identidade
// assinada, entao o portal nao precisa de chave nenhuma nem falar direto com o
// banco do outro sistema. Quem nao tem o modulo recebe 403 e nao chega aqui.
//
// Nada disto pode derrubar a tela inicial: se as Tarefas estiverem fora do ar,
// ou a resposta vier estranha, o painel simplesmente nao aparece. A pessoa
// entrou para abrir os modulos, nao para ver reservas.
var DIAS_A_FRENTE = 14;
var MAX_RESERVAS = 4;

// A busca das reservas NAO segura o desenho da tela: os modulos aparecem na
// hora e o painel entra quando chegar. Esta variavel guarda a promessa so para
// o teste conseguir esperar por ela — sem isso, ele terminaria antes.
var reservasPendentes = null;

async function carregarReservas() {
  try {
    var eu = await pedirJson('/tarefas/api/me');
    var meuId = eu && eu.usuario && eu.usuario.id;
    if (!meuId) return;

    var hoje = new Date();
    var fim = new Date();
    fim.setDate(fim.getDate() + DIAS_A_FRENTE);
    var lista = await pedirJson('/tarefas/api/reservas-sala?inicio=' + iso(hoje) + '&fim=' + iso(fim));
    if (!Array.isArray(lista)) return;

    // "Minhas" = as que eu reservei mais aquelas em que fui posto como
    // participante. Sem a segunda metade, quem e chamado para a reuniao de
    // outra pessoa nao veria nada — e e justamente quem mais esquece.
    var minhas = lista.filter(function (r) {
      if (String(r.usuario_id) === String(meuId)) return true;
      return (r.participantes || []).some(function (p) { return String(p.id) === String(meuId); });
    });

    // Hoje, so o que ainda nao terminou: reserva das 9h nao ajuda ninguem as 15h.
    // As horas sao NUMERO de minutos desde a meia-noite, entao a comparacao e
    // numerica — comparar como texto daria "870" >= "14:30" e acertaria por
    // acidente em alguns casos e erraria em outros.
    var agora = new Date();
    var minutosAgora = agora.getHours() * 60 + agora.getMinutes();
    minhas = minhas.filter(function (r) {
      return diaDe(r.data) !== iso(agora) || Number(r.hora_fim) >= minutosAgora;
    });

    if (!minhas.length) return mostrarSalas(
      '<div class="card nenhuma">Nenhuma reserva sua nos próximos ' + DIAS_A_FRENTE + ' dias.</div>' +
      '<a class="todos" href="/tarefas/?ir=agenda-salas">Reservar uma sala →</a>');

    var html = minhas.slice(0, MAX_RESERVAS).map(function (r) {
      var dia = diaDe(r.data);
      var ehHoje = dia === iso(new Date());
      return '<div class="card reserva' + (ehHoje ? ' hoje' : '') + '">' +
        '<span class="quando">' +
          '<b class="dia">' + (ehHoje ? 'hoje' : esc(diaCurto(dia))) + '</b>' +
          '<b class="hora">' + esc(hora(r.hora_inicio)) + '</b>' +
        '</span>' +
        '<span class="oque">' +
          '<span class="titulo-reserva">' + esc(r.titulo || '(sem título)') + '</span>' +
          '<span class="sala">' + esc(nomeDaSala(r.sala)) +
            (String(r.usuario_id) === String(meuId) ? '' : ' · de ' + esc(r.usuario_nome || '')) +
          '</span>' +
        '</span></div>';
    }).join('');

    var sobra = minhas.length - MAX_RESERVAS;
    mostrarSalas(html + '<a class="todos" href="/tarefas/?ir=agenda-salas">' +
      (sobra > 0 ? '+ ' + sobra + (sobra === 1 ? ' outra reserva' : ' outras reservas') : 'Ver a agenda de salas') +
      ' →</a>');
  } catch (e) {
    // Silencio de proposito: ver comentario acima.
    console.warn('Nao consegui carregar as reservas de sala:', e);
  }
}

function mostrarSalas(html) {
  document.getElementById('salasLista').innerHTML = html;
  document.getElementById('salas').style.display = '';
}

async function pedirJson(url) {
  var r = await fetch(url, { headers: { accept: 'application/json' } });
  if (!r.ok) throw new Error(url + ' respondeu ' + r.status);
  return r.json();
}

// As horas das reservas nao sao texto: sao MINUTOS desde a meia-noite (870 =
// 14:30). Sem esta conversao a tela mostrava "870" no lugar do horario.
function hora(minutos) {
  var m = Number(minutos);
  if (!Number.isFinite(m)) return '';
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' +
         String(m % 60).padStart(2, '0');
}

// E a sala vem como chave ("menor", "tao"), nao como nome. Os rotulos sao os
// mesmos da Agenda de Salas (SALA_LABELS, no index.html das Tarefas) — uma
// chave nova aparece com o proprio nome cru, que e feio mas honesto, em vez de
// sumir da tela.
var SALAS = {
  principal: 'Sala Principal',
  menor: 'Sala Menor',
  auditorio: 'Auditório',
  entrevista: 'Sala de Entrevista Individual',
  tao: 'Sala 6 - TAO',
};

function nomeDaSala(chave) { return SALAS[chave] || String(chave || ''); }

// A data vem do Postgres como DATE e chega em ISO ("2026-09-02T00:00:00.000Z").
// Cortar os 10 primeiros caracteres e proposital: converter para Date local
// deslocaria o dia para tras em qualquer fuso a oeste de Greenwich.
function diaDe(valor) { return String(valor || '').slice(0, 10); }

function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

var SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

function diaCurto(dia) {
  var p = dia.split('-');
  // Meio-dia, e nao meia-noite: evita que o horario de verao empurre a data
  // para o dia anterior na hora de descobrir o dia da semana.
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12);
  return SEMANA[d.getDay()] + ' ' + p[2] + '/' + p[1];
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function exigirNovaSenha() {
  document.querySelector('.titulo').textContent = 'Defina sua senha';
  document.getElementById('sub').textContent =
    'Você entrou com uma senha provisória. Escolha uma senha sua para continuar.';
  document.getElementById('grade').innerHTML =
    '<div class="card trocaSenha">' +
      '<div id="avisoSenha"></div>' +
      '<label class="campo"><span>Senha provisória</span>' +
        '<input type="password" id="sAtual" autocomplete="current-password"></label>' +
      '<label class="campo"><span>Nova senha</span>' +
        '<input type="password" id="sNova" autocomplete="new-password" placeholder="mínimo 8 caracteres"></label>' +
      '<label class="campo"><span>Repita a nova senha</span>' +
        '<input type="password" id="sNova2" autocomplete="new-password"></label>' +
      '<button class="btn" id="btnSenha">Salvar e continuar</button>' +
    '</div>';

  document.getElementById('btnSenha').addEventListener('click', async function () {
    var btn = this;
    var aviso = document.getElementById('avisoSenha');
    var nova = document.getElementById('sNova').value;
    aviso.innerHTML = '';

    if (nova.length < 8) {
      aviso.innerHTML = '<div class="aviso aviso-erro">A nova senha precisa ter ao menos 8 caracteres.</div>';
      return;
    }
    if (nova !== document.getElementById('sNova2').value) {
      aviso.innerHTML = '<div class="aviso aviso-erro">As duas senhas não conferem.</div>';
      return;
    }

    btn.disabled = true;
    try {
      var r = await fetch('/api/senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ atual: document.getElementById('sAtual').value, nova: nova })
      });
      var dados = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(dados.erro || 'Não foi possível salvar');
      location.reload();
    } catch (e) {
      aviso.innerHTML = '<div class="aviso aviso-erro">' + esc(e.message) + '</div>';
      btn.disabled = false;
    }
  });
}

async function sair() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
}

carregar();
</script>
