<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" role="img" aria-label="UniGestão">
  <title>UniGestão</title>
  <!--
    Simbolo + nome, para usar onde couber horizontal: cabecalho de documento,
    apresentacao, assinatura.

    O nome vai como TEXTO, nao como contorno, para o arquivo continuar pequeno e
    editavel. Isso significa que ele depende da fonte instalada: sem DM Sans,
    cai em Arial, que muda um pouco o desenho das letras mas nao quebra nada.
    Se algum dia precisar de um arquivo a prova de fonte — grafica, fornecedor
    externo —, o caminho e converter o texto em curvas num editor vetorial.
  -->
  <defs>
    <linearGradient id="ugGradL" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="58">
      <stop offset="0" stop-color="#F7B312"/>
      <stop offset=".55" stop-color="#F7B312"/>
      <stop offset=".72" stop-color="#EC7807"/>
      <stop offset="1" stop-color="#EC7807"/>
    </linearGradient>
    <mask id="ugCavidadeL">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="53" cy="28.8" r="3.7" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke="url(#ugGradL)">
    <path d="M11 6 V34 A21 21 0 0 0 53 34 V30" stroke-width="7"/>
    <path d="M17.5 6 V34 A14.5 14.5 0 0 0 46.5 34 V30" stroke-width="3.2"/>
    <path d="M24 6 V34 A8 8 0 0 0 40 34 V30" stroke-width="2.8"/>
  </g>
  <circle cx="53" cy="30" r="3" fill="#EC7807"/>
  <g fill="#26357A" mask="url(#ugCavidadeL)">
    <rect x="49.5" y="6" width="7" height="22.8" rx="3.5"/>
    <rect x="44.9" y="6" width="3.2" height="22.8" rx="1.6"/>
    <rect x="38.6" y="6" width="2.8" height="22.8" rx="1.4"/>
  </g>

  <text x="76" y="42" font-family="DM Sans, Arial, Helvetica, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-.5">
    <tspan fill="#26357A">Uni</tspan><tspan fill="#EC7807">Gestão</tspan>
  </text>
</svg>
