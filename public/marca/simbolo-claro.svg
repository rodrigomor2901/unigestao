<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UniGestão">
  <title>UniGestão</title>
  <!--
    O simbolo do UniGestao.

    E o U do Grupo Uniseter — tres tracos finos aninhados, bracos altos, degrade
    amarelo em cima e laranja embaixo — com a perna direita substituida por uma
    peca de encaixe em navy, ja assentada. Uma folga fina em volta do dente
    deixa a junta a mostra: as pecas estao no lugar, mas da para ver onde uma
    termina e a outra comeca.

    A leitura e a arquitetura do sistema: as frentes coloridas do Grupo seguem
    sendo cada uma a sua, e a peca navy — navy e a cor da palavra UNISETER, a
    cor da instituicao — e o que fecha o conjunto.

    Cores tiradas do arquivo original da marca:
      amarelo #F7B312   laranja #EC7807   navy #26357A

    O degrade usa userSpaceOnUse para que os tres tracos troquem de cor na
    MESMA altura. Com o padrao (objectBoundingBox) cada traco usaria a propria
    caixa e a virada sairia escalonada.
  -->
  <defs>
    <linearGradient id="ugGrad" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="58">
      <stop offset="0" stop-color="#F7B312"/>
      <stop offset=".55" stop-color="#F7B312"/>
      <stop offset=".72" stop-color="#EC7807"/>
      <stop offset="1" stop-color="#EC7807"/>
    </linearGradient>
    <mask id="ugCavidade">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="53" cy="28.8" r="3.7" fill="#000"/>
    </mask>
  </defs>

  <!-- o U do Grupo, com a perna direita interrompida em y=30 -->
  <g fill="none" stroke="url(#ugGrad)">
    <path d="M11 6 V34 A21 21 0 0 0 53 34 V30" stroke-width="7"/>
    <path d="M17.5 6 V34 A14.5 14.5 0 0 0 46.5 34 V30" stroke-width="3.2"/>
    <path d="M24 6 V34 A8 8 0 0 0 40 34 V30" stroke-width="2.8"/>
  </g>

  <!-- o dente, no traco do Grupo -->
  <circle cx="53" cy="30" r="3" fill="#EC7807"/>

  <!-- a peca em branco: sobre fundo navy o proprio azul da peca sumiria -->
  <g fill="#ffffff" mask="url(#ugCavidade)">
    <rect x="49.5" y="6" width="7" height="22.8" rx="3.5"/>
    <rect x="44.9" y="6" width="3.2" height="22.8" rx="1.6"/>
    <rect x="38.6" y="6" width="2.8" height="22.8" rx="1.4"/>
  </g>
</svg>
